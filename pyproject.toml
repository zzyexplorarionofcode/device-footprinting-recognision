[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fade-learning-code"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
description = "FADE algorithm, adapted baselines and IoT traffic preprocessing"
dependencies = ["numpy>=1.26,<2", "scipy>=1.14", "scikit-learn>=1.7", "torch>=2.5", "openpyxl>=3.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["methods*", "data_pipeline*", "baselines*", "experiments*", "experiment_support*", "configs*", "scripts*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
configs = ["methods/*.json", "experiments/*.json"]
baselines = ["securitas/configs/*.json"]
